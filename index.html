            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);

            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s ease-in-out;
        }
        .post-it:hover {
            background-color: #87CEEB;
        }
        .post-it a {
            text-decoration: none;
            color: #000;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: color 0.2s ease-in-out;
        }
